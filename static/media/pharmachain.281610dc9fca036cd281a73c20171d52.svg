<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#cffafe"/>
  <g transform="translate(200 160)">
    <!-- chain links -->
    <g stroke="#0e7490" stroke-width="12" fill="none">
      <rect x="-96" y="-14" width="64" height="28" rx="14"/>
      <rect x="-44" y="-14" width="64" height="28" rx="14"/>
    </g>
    <!-- capsule pill -->
    <g transform="rotate(45 44 0)">
      <rect x="14" y="-26" width="92" height="52" rx="26" fill="#0891b2"/>
      <rect x="60" y="-26" width="46" height="52" rx="26" fill="#06b6d4"/>
      <rect x="14" y="-26" width="92" height="52" rx="26" fill="none" stroke="#155e75" stroke-width="4"/>
    </g>
  </g>
  <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#155e75">PharmaChain</text>
  <text x="200" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0e7490">Supply-Chain Traceability</text>
</svg>
