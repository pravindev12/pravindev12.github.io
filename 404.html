<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pravin Raj — Blockchain Development Partner</title>
    <!--
      SPA fallback for GitHub Pages (single-page-apps-for-github-pages).
      Redirects deep links (e.g. /blogs/my-post) to index.html so React Router
      can handle them. pathSegmentsToKeep = 0 for a root user/org page.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
